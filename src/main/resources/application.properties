# ── Server ────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Email via Resend HTTP API ─────────────────────────────────
# Sign up free at resend.com (use your Gmail to sign in)
# Set RESEND_API_KEY in Railway Variables
resend.api.key=${RESEND_API_KEY:}
# Use your verified domain email, or onboarding@resend.dev for testing
resend.from.email=${RESEND_FROM:onboarding@resend.dev}

# ── File upload ───────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ── Face++ API ────────────────────────────────────────────────
facepp.api.key=${FACEPP_API_KEY:}
facepp.api.secret=${FACEPP_API_SECRET:}

# ── Database ──────────────────────────────────────────────────
# For local dev: use the PUBLIC host from Railway dashboard → MySQL → Connect tab
# e.g. jdbc:mysql://roundhouse.proxy.rlwy.net:PORT/railway?...
spring.datasource.url=jdbc:mysql://shinkansen.proxy.rlwy.net:58340/railway?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=IhFVKeIKyxXsKGfnPHbBdOSOcAxAxxCa
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3

# ── Thymeleaf ─────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Session ───────────────────────────────────────────────────
server.servlet.session.timeout=15m

# ── Logging ───────────────────────────────────────────────────
logging.level.com.evote=DEBUG
