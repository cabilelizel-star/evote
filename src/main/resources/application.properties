# ── Server ────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Email via Resend HTTP API ─────────────────────────────────
# Sign up free at resend.com (use your Gmail to sign in)
# Set RESEND_API_KEY in Railway Variables
# ── Email via Gmail SMTP ──────────────────────────────────────
# Use your Gmail address and an App Password (NOT your real password)
# To get App Password: Google Account → Security → 2-Step Verification → App Passwords
# Set GMAIL_USER and GMAIL_PASS as environment variables, or hardcode below for local dev
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:your_gmail@gmail.com}
spring.mail.password=${GMAIL_PASS:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# From address shown to recipients
evote.mail.from=${GMAIL_USER:your_gmail@gmail.com}

# ── File upload ───────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ── Face++ API ────────────────────────────────────────────────
facepp.api.key=${FACEPP_API_KEY:}
facepp.api.secret=${FACEPP_API_SECRET:}

# ── Database ──────────────────────────────────────────────────
