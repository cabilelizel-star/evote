# ── Thymeleaf ─────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Session ───────────────────────────────────────────────────
server.servlet.session.timeout=15m

# ── Logging ───────────────────────────────────────────────────
logging.level.com.evote=DEBUG
