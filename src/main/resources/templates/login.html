<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eVOTE Secured Ballot — Sign In</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Segoe UI',Arial,sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0,180,255,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0,100,255,0.12) 0%, transparent 50%),
                linear-gradient(135deg, #020b18 0%, #041428 40%, #061e3a 70%, #030f22 100%);
            padding:20px;
        }

        /* ── Outer card ── */
        .card-wrap{
            display:flex;
            width:100%;
            max-width:860px;
            min-height:480px;
            border-radius:24px;
            overflow:hidden;
            box-shadow:0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,150,255,0.15);
        }

        /* ── LEFT — Form (blue) ── */
        .form-side{
            flex:0 0 55%;
            background:linear-gradient(160deg, #1a6fd4 0%, #1558b0 40%, #0d3f8a 100%);
            padding:52px 48px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }
        .form-label-top{
            font-size:11px;
            font-weight:800;
            letter-spacing:3px;
            color:rgba(255,255,255,0.7);
            text-transform:uppercase;
            margin-bottom:8px;
        }
        .form-title{
            font-size:2rem;
            font-weight:800;
            color:#fff;
            margin-bottom:8px;
            line-height:1.2;
        }
        .form-sub{
            font-size:13px;
            color:rgba(255,255,255,0.75);
            margin-bottom:32px;
            line-height:1.6;
        }
        .field-label{
            font-size:12px;
            font-weight:700;
            color:rgba(255,255,255,0.9);
            margin-bottom:7px;
            display:block;
        }
        .input-wrap{
            display:flex;
            align-items:center;
            background:rgba(255,255,255,0.15);
            border:1.5px solid rgba(255,255,255,0.25);
            border-radius:50px;
            margin-bottom:18px;
            transition:border-color .2s, background .2s;
        }
        .input-wrap:focus-within{
            background:rgba(255,255,255,0.22);
            border-color:rgba(255,255,255,0.6);
        }
        .input-wrap input{
            flex:1;
            background:transparent;
            border:none;
            outline:none;
            padding:13px 20px;
            font-size:14px;
            color:#fff;
        }
        .input-wrap input::placeholder{color:rgba(255,255,255,0.55)}
        .input-wrap .iicon{
            padding:0 16px 0 0;
            color:rgba(255,255,255,0.6);
            display:flex;
            align-items:center;
        }
        .options-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:24px;
            font-size:13px;
        }
        .options-row label{
            display:flex;align-items:center;gap:7px;
            color:rgba(255,255,255,0.8);cursor:pointer;
        }
        .options-row label input[type=checkbox]{
            accent-color:#fff;width:15px;height:15px;
        }
        .options-row a{
            color:rgba(255,255,255,0.85);
            text-decoration:underline;
            font-weight:600;
        }
        .btn-signin{
            width:100%;
            padding:14px;
            background:linear-gradient(135deg,#22c55e,#16a34a);
            border:none;
            border-radius:50px;
            color:#fff;
            font-size:14px;
            font-weight:800;
            letter-spacing:2px;
            text-transform:uppercase;
            cursor:pointer;
            box-shadow:0 6px 20px rgba(0,0,0,0.25);
            transition:all .2s;
            margin-bottom:20px;
        }
        .btn-signin:hover{
            background:linear-gradient(135deg,#16a34a,#15803d);
            transform:translateY(-1px);
            box-shadow:0 8px 24px rgba(0,0,0,0.3);
        }
        .form-footer{
            text-align:center;
            font-size:13px;
            color:rgba(255,255,255,0.7);
        }
        .form-footer a{
            color:#fff;
            font-weight:700;
            text-decoration:underline;
        }
        .alert-box{
            padding:10px 16px;
            border-radius:10px;
            margin-bottom:16px;
            font-size:13px;
        }
        .alert-error{background:rgba(239,68,68,0.25);color:#fecaca;border:1px solid rgba(239,68,68,0.4)}
        .alert-success{background:rgba(34,197,94,0.2);color:#bbf7d0;border:1px solid rgba(34,197,94,0.3)}

        /* ── RIGHT — Logo (white) ── */
        .logo-side{
            flex:1;
            background:#f0f4ff;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:40px 32px;
            position:relative;
            overflow:hidden;
        }
        /* Decorative circle top-right */
        .logo-side::before{
            content:'';
            position:absolute;
            top:-60px;right:-60px;
            width:200px;height:200px;
            border-radius:50%;
            border:2px dashed rgba(0,100,200,0.2);
        }
        .logo-side::after{
            content:'';
            position:absolute;
            bottom:-80px;left:-80px;
            width:240px;height:240px;
            border-radius:50%;
            border:2px dashed rgba(0,100,200,0.12);
        }
        .logo-svg-wrap{
            position:relative;
            z-index:1;
            text-align:center;
        }

        /* Responsive */
        @media(max-width:680px){
            .card-wrap{flex-direction:column}
            .form-side{padding:36px 28px}
            .logo-side{padding:32px 24px;min-height:220px}
        }
    </style>
</head>
<body>

<div class="card-wrap">

    <!-- ═══ LEFT — Login Form ═══ -->
    <div class="form-side">
        <div class="form-label-top">WELCOME</div>
        <div class="form-title">Welcome back</div>
        <div class="form-sub">Sign in with your registered SecureBallot account to continue voting securely.</div>

        <div th:if="${success}" class="alert-box alert-success" th:text="${success}"></div>
        <div th:if="${error}"   class="alert-box alert-error"   th:text="${error}"></div>

        <!-- Honeypot anti-autofill -->
        <input type="text"     style="display:none" aria-hidden="true" tabindex="-1">
        <input type="password" style="display:none" aria-hidden="true" tabindex="-1">

        <form method="post" th:action="@{/login}" autocomplete="off">
            <label class="field-label">Email or Username</label>
            <div class="input-wrap">
                <input type="text" id="loginUsername" name="username"
                       placeholder="Enter your username or Voter ID"
                       required autofocus
                       autocomplete="off" autocorrect="off" autocapitalize="off"
                       readonly onfocus="this.removeAttribute('readonly')">
                <span class="iicon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </span>
            </div>

            <label class="field-label">Password</label>
            <div class="input-wrap">
                <input type="password" id="loginPassword" name="password"
                       placeholder="Enter your password"
                       required
                       autocomplete="new-password"
                       readonly onfocus="this.removeAttribute('readonly')">
                <span class="iicon" style="cursor:pointer" onclick="togglePw()">
                    <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </span>
            </div>

            <div class="options-row">
                <label><input type="checkbox" name="remember"> Remember me</label>
                <a th:href="@{/forgot-password}">Forgot password?</a>
            </div>

            <button type="submit" class="btn-signin">Sign In</button>
        </form>

        <div class="form-footer">
            Don't have an account? <a th:href="@{/register}">Register here</a>
        </div>
    </div>

    <!-- ═══ RIGHT — Logo ═══ -->
    <div class="logo-side">
        <div class="logo-svg-wrap">
            <svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg" width="220" height="231">
                <defs>
                    <linearGradient id="sg1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#1e3a8a"/>
                        <stop offset="100%" style="stop-color:#1e40af"/>
                    </linearGradient>
                    <linearGradient id="sg2" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#2563eb"/>
                        <stop offset="100%" style="stop-color:#3b82f6"/>
                    </linearGradient>
                    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#94a3b8"/>
                        <stop offset="100%" style="stop-color:#cbd5e1"/>
                    </linearGradient>
                    <filter id="dropshadow">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
                        <feOffset dx="0" dy="6"/>
                        <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
                        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>

                <!-- Shield left half (dark) -->
                <path d="M200 20 L340 55 L340 210 Q340 300 200 350 L200 20Z"
                      fill="url(#sg1)" filter="url(#dropshadow)"/>
                <!-- Shield right half (bright) -->
                <path d="M200 20 L60 55 L60 210 Q60 300 200 350 L200 20Z"
                      fill="url(#sg2)" filter="url(#dropshadow)"/>
                <!-- Shield border -->
                <path d="M200 20 L340 55 L340 210 Q340 300 200 350 Q60 300 60 210 L60 55 Z"
                      fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>

                <!-- Ballot box (3D) -->
                <!-- Box top face -->
                <ellipse cx="200" cy="148" rx="90" ry="18" fill="#1e293b" opacity="0.7"/>
                <ellipse cx="200" cy="144" rx="90" ry="18" fill="#334155"/>
                <!-- Slot -->
                <rect x="170" y="136" width="60" height="8" rx="4" fill="#0f172a"/>
                <!-- Box front face -->
                <rect x="110" y="144" width="180" height="90" rx="4" fill="#1e3a8a" opacity="0.6"/>
                <rect x="113" y="147" width="174" height="84" rx="3" fill="#1e40af" opacity="0.5"/>

                <!-- Ballot paper -->
                <g filter="url(#dropshadow)">
                    <rect x="162" y="72" width="76" height="90" rx="6" fill="url(#pg)" stroke="#94a3b8" stroke-width="1.5"/>
                    <!-- Checkmark -->
                    <polyline points="178,112 192,126 224,96"
                              fill="none" stroke="#2563eb" stroke-width="6"
                              stroke-linecap="round" stroke-linejoin="round"/>
                </g>

                <!-- Padlock -->
                <g filter="url(#dropshadow)">
                    <rect x="178" y="258" width="44" height="38" rx="7" fill="#1e293b"/>
                    <rect x="181" y="261" width="38" height="32" rx="5" fill="#334155"/>
                    <circle cx="200" cy="274" r="5" fill="#0f172a"/>
                    <rect x="197" y="274" width="6" height="10" rx="2" fill="#0f172a"/>
                    <path d="M185 258 Q185 238 200 238 Q215 238 215 258"
                          fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
                    <path d="M187 258 Q187 241 200 241 Q213 241 213 258"
                          fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
                </g>

                <!-- Text: secure -->
                <text x="60" y="390" font-family="'Segoe UI',Arial,sans-serif"
                      font-size="46" font-weight="700" fill="#1e3a8a">secure</text>
                <!-- Text: ballot -->
                <text x="200" y="390" font-family="'Segoe UI',Arial,sans-serif"
                      font-size="46" font-weight="700" fill="#2563eb"> ballot</text>
            </svg>
        </div>
    </div>

</div>

<script>
window.addEventListener('load', function() {
    var u = document.getElementById('loginUsername');
    var p = document.getElementById('loginPassword');
    if (u) u.value = '';
    if (p) p.value = '';
});
function togglePw() {
    var f = document.getElementById('loginPassword');
    var o = document.getElementById('eyeOpen');
    var c = document.getElementById('eyeClosed');
    if (f.type === 'password') {
        f.type = 'text'; o.style.display = 'none'; c.style.display = 'block';
    } else {
        f.type = 'password'; o.style.display = 'block'; c.style.display = 'none';
    }
}
</script>
</body>
</html>
