<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Vote System — Sign In</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-card">

    <!-- Logo -->
    <div style="text-align:center;margin-bottom:20px">
      <svg width="220" height="80" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg">
        <!-- Shield shape -->
        <defs>
          <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a4fa0;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#0d2d6b;stop-opacity:1"/>
          </linearGradient>
          <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00e676;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#00b248;stop-opacity:1"/>
          </linearGradient>
        </defs>
        <!-- Shield body -->
        <path d="M18 8 L42 8 L42 38 Q42 52 30 58 Q18 52 18 38 Z" fill="url(#shieldGrad)" stroke="#2d6be4" stroke-width="1.5"/>
        <!-- Inner shield highlight -->
        <path d="M22 12 L38 12 L38 36 Q38 47 30 52 Q22 47 22 36 Z" fill="none" stroke="rgba(100,180,255,0.4)" stroke-width="1"/>
        <!-- Checkmark -->
        <polyline points="22,33 27,39 38,25" fill="none" stroke="url(#checkGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Padlock top -->
        <path d="M24 14 Q24 8 30 8 Q36 8 36 14" fill="none" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
        <!-- Circuit dots -->
        <circle cx="18" cy="42" r="1.5" fill="#00e5ff" opacity="0.7"/>
        <circle cx="42" cy="42" r="1.5" fill="#00e5ff" opacity="0.7"/>
        <circle cx="30" cy="62" r="1.5" fill="#00e5ff" opacity="0.7"/>
        <line x1="18" y1="42" x2="12" y2="48" stroke="#00e5ff" stroke-width="0.8" opacity="0.5"/>
        <line x1="42" y1="42" x2="48" y2="48" stroke="#00e5ff" stroke-width="0.8" opacity="0.5"/>
        <!-- eVOTE text -->
        <text x="58" y="38" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="900" fill="#1a3a7a" letter-spacing="1">e</text>
        <text x="74" y="38" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="900" fill="#1a4fa0" letter-spacing="1">V</text>
        <!-- O with circuit dot -->
        <text x="92" y="38" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="900" fill="#1a4fa0" letter-spacing="1">O</text>
        <circle cx="106" cy="26" r="3" fill="#4a90d9"/>
        <circle cx="106" cy="26" r="1.5" fill="#fff"/>
        <text x="114" y="38" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="900" fill="#1a4fa0" letter-spacing="1">TE</text>
        <!-- SECURED BALLOT -->
        <text x="58" y="54" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#5a7a9a" letter-spacing="3">SECURED BALLOT</text>
      </svg>
    </div>

    <!-- Title with divider lines -->
    <div class="auth-title-row">
        <hr><span>Sign in</span><hr>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <!-- Form -->
    <form method="post" th:action="@{/login}">
        <div class="input-group">
            <span class="icon">&#128100;</span>
            <input type="text" name="username" placeholder="Username" required autofocus>
        </div>
        <div class="input-group">
            <span class="icon">&#128274;</span>
            <input type="password" id="loginPassword" name="password" placeholder="Password" required>
            <button type="button" onclick="togglePw()" id="eyeBtn"
                style="background:none;border:none;cursor:pointer;padding:0 12px;color:#6b7a99;display:flex;align-items:center;line-height:1">
                <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
            </button>
        </div>

        <div class="options-row">
            <label><input type="checkbox" name="remember"> Remember me</label>
            <a th:href="@{/forgot-password}">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">Login</button>
    </form>

    <div class="auth-footer">
        Not registered? <a th:href="@{/register}">Create an account!</a>
    </div>
</div>
<script>
function togglePw() {
    var f = document.getElementById('loginPassword');
    var open = document.getElementById('eyeOpen');
    var closed = document.getElementById('eyeClosed');
    if (f.type === 'password') {
        f.type = 'text';
        open.style.display = 'none';
        closed.style.display = 'block';
    } else {
        f.type = 'password';
        open.style.display = 'block';
        closed.style.display = 'none';
    }
}
</script>
</body>
</html>
