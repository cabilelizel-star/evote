<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Vote System — Create Account</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-card" style="width:460px">

    <div class="auth-avatar">✍</div>
    <div class="auth-title-row"><hr><span>Create Account</span><hr></div>

    <p style="font-size:13px;color:#888;text-align:center;margin-bottom:20px">
        Step 1 of 4 — Basic Information
    </p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form method="post" th:action="@{/register/send-otp}">
        <div class="input-group">
            <span class="icon">🪪</span>
            <input type="text" name="voterId" placeholder="Voter ID  (e.g. V001)" required>
        </div>
        <div class="input-group">
            <span class="icon">📝</span>
            <input type="text" name="name" placeholder="Full Name" required>
        </div>
        <div class="input-group">
            <span class="icon">📧</span>
            <input type="email" name="email" placeholder="Email Address (for OTP)" required>
        </div>
        <div class="input-group">
            <span class="icon">🔒</span>
            <input type="password" name="password" placeholder="Password  (min. 6 chars)" required>
        </div>
        <div class="input-group">
            <span class="icon">🔒</span>
            <input type="password" name="confirm" placeholder="Confirm Password" required>
        </div>

        <button type="submit" class="btn-primary">Send OTP to Email →</button>
    </form>

    <div class="auth-footer">
        Already have an account? <a th:href="@{/login}">Sign in</a>
    </div>
</div>
</body>
</html>
