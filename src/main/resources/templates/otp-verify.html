<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Vote — Verify OTP</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .otp-inputs { display:flex; gap:10px; justify-content:center; margin:24px 0; }
        .otp-input {
            width:52px; height:60px; text-align:center;
            font-size:26px; font-weight:800; color:#1a6b3c;
            border:1.5px solid #d1d5db; border-radius:10px;
            outline:none; background:#fff;
            transition:border-color .2s, box-shadow .2s;
        }
        .otp-input:focus { border-color:#2d9e5f; box-shadow:0 0 0 3px rgba(45,158,95,0.12); }
        .resend-link { color:#2d9e5f; cursor:pointer; font-weight:700; text-decoration:underline; }
        .timer { color:#888; font-size:13px; }
        .otp-body { min-height:100vh; background:#f0faf4; display:flex; align-items:center; justify-content:center; padding:24px; }
        .otp-card { background:#fff; border-radius:16px; padding:44px 48px; width:100%; max-width:440px; box-shadow:0 4px 24px rgba(26,107,60,0.10); text-align:center; }
        .otp-card h1 { font-size:24px; font-weight:800; color:#1a1a1a; margin-bottom:8px; }
        .otp-btn { width:100%; padding:14px; background:#2d9e5f; border:none; border-radius:8px; color:#fff; font-size:16px; font-weight:700; cursor:pointer; transition:background .2s; }
        .otp-btn:hover { background:#1a6b3c; }
        .alert-error { background:#fff0f0; color:#c0392b; border:1px solid #f5c6c6; border-radius:8px; padding:12px 16px; font-size:13px; margin-bottom:16px; }
        .fallback-box { background:#f0faf4; border:2px dashed #2d9e5f; border-radius:10px; padding:16px; margin-bottom:16px; }
    </style>
</head>
<body style="min-height:100vh;background:#f0faf4;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Segoe UI',system-ui,sans-serif">
<div style="background:#fff;border-radius:16px;padding:44px 48px;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(26,107,60,0.10);text-align:center">

    <div style="font-size:40px;margin-bottom:12px">📧</div>
    <h1 style="font-size:24px;font-weight:800;color:#1a1a1a;margin:0 0 8px">Verify Your Email</h1>
    <div style="display:inline-block;background:#f0faf4;color:#2d9e5f;border:1.5px solid #a8dfc0;border-radius:20px;padding:4px 14px;font-size:12px;font-weight:700;margin-bottom:16px">Step 6 — OTP Verification</div>    <p style="color:#555;font-size:14px;margin-bottom:4px">
        We sent a 6-digit code to
    </p>
    <p style="color:#1a6b3c;font-weight:700;font-size:15px;margin-bottom:20px"
       th:text="${email}"></p>

    <div th:if="${error}" style="background:#fff0f0;color:#c0392b;border:1px solid #f5c6c6;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:16px" th:text="${error}"></div>

    <!-- Fallback: show OTP on screen if email failed -->
    <div th:if="${otpFallback}" style="background:#f0faf4;border:2px dashed #2d9e5f;border-radius:10px;padding:16px;margin-bottom:16px">
        <div style="font-size:13px;color:#555;margin-bottom:8px">⚠ Email could not be sent. Your OTP code is:</div>
        <div style="font-size:36px;font-weight:900;letter-spacing:10px;color:#1a6b3c" th:text="${otpFallback}"></div>
        <div style="font-size:11px;color:#888;margin-top:6px">Enter this code below to continue.</div>
    </div>

    <form method="post" th:action="@{/register/verify-otp}" id="otpForm">
        <div class="otp-inputs">
            <input class="otp-input" type="text" maxlength="1" id="o1" oninput="moveNext(this,'o2')" onkeydown="movePrev(event,this,'')">
            <input class="otp-input" type="text" maxlength="1" id="o2" oninput="moveNext(this,'o3')" onkeydown="movePrev(event,this,'o1')">
            <input class="otp-input" type="text" maxlength="1" id="o3" oninput="moveNext(this,'o4')" onkeydown="movePrev(event,this,'o2')">
            <input class="otp-input" type="text" maxlength="1" id="o4" oninput="moveNext(this,'o5')" onkeydown="movePrev(event,this,'o3')">
            <input class="otp-input" type="text" maxlength="1" id="o5" oninput="moveNext(this,'o6')" onkeydown="movePrev(event,this,'o4')">
            <input class="otp-input" type="text" maxlength="1" id="o6" oninput="moveNext(this,'')"   onkeydown="movePrev(event,this,'o5')">
        </div>
        <input type="hidden" name="otp" id="otpHidden">
        <button type="button" style="width:100%;padding:14px;background:#2d9e5f;border:none;border-radius:8px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:background .2s" onmouseover="this.style.background='#1a6b3c'" onmouseout="this.style.background='#2d9e5f'" onclick="submitOtp()">Verify Code</button>
    </form>

    <p style="color:#888;font-size:13px;margin-top:16px">
        Code expires in <span id="countdown">10:00</span>
    </p>
    <p style="font-size:13px;color:#888;margin-top:8px">
        Didn't receive it?
        <a th:href="@{/register}" style="color:#2d9e5f;font-weight:700">Go back and try again</a>
    </p>

    <div style="text-align:center;margin-top:20px;font-size:14px;color:#6b7280">
        <a th:href="@{/login}" style="color:#2d9e5f;font-weight:700;text-decoration:none">← Back to Sign In</a>
    </div>
</div>

<script>
function moveNext(el, nextId) {
    el.value = el.value.replace(/[^0-9]/g,'');
    if (el.value && nextId) document.getElementById(nextId).focus();
    checkComplete();
}
function movePrev(e, el, prevId) {
    if (e.key === 'Backspace' && !el.value && prevId) {
        document.getElementById(prevId).focus();
    }
}
function checkComplete() {
    const vals = ['o1','o2','o3','o4','o5','o6'].map(id => document.getElementById(id).value);
    if (vals.every(v => v)) submitOtp();
}
function submitOtp() {
    const otp = ['o1','o2','o3','o4','o5','o6'].map(id => document.getElementById(id).value).join('');
    if (otp.length < 6) { alert('Please enter the complete 6-digit code.'); return; }
    document.getElementById('otpHidden').value = otp;
    document.getElementById('otpForm').submit();
}

// Countdown timer
let seconds = 600;
const timer = setInterval(() => {
    seconds--;
    const m = Math.floor(seconds/60).toString().padStart(2,'0');
    const s = (seconds%60).toString().padStart(2,'0');
    document.getElementById('countdown').textContent = m+':'+s;
    if (seconds <= 0) { clearInterval(timer); document.getElementById('countdown').textContent = 'Expired'; }
}, 1000);

document.getElementById('o1').focus();
</script>
</body>
</html>
