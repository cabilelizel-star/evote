<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Vote System — Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .otp-inputs { display:flex; gap:10px; justify-content:center; margin:20px 0; }
        .otp-input {
            width:48px; height:56px; text-align:center;
            font-size:24px; font-weight:800; color:#1a6b3c;
            border:1.5px solid #d1d5db; border-radius:10px;
            outline:none; background:#fff;
            transition:border-color .2s, box-shadow .2s;
        }
        .otp-input:focus { border-color:#2d9e5f; box-shadow:0 0 0 3px rgba(45,158,95,.12); }
    </style>
</head>
<body class="auth-body">
<div class="auth-card" style="width:440px">

    <div class="auth-avatar">🔑</div>
    <div class="auth-title-row"><hr><span>Reset Password</span><hr></div>

    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Step 1: Enter Voter ID + Email -->
    <div th:if="${step == null}">
        <p style="color:#555;font-size:13px;margin-bottom:20px;text-align:center">
            Enter your Voter ID and registered email. We'll send you a reset code.
        </p>
        <form method="post" th:action="@{/forgot-password}">
            <input type="hidden" name="step" value="request">
            <div class="input-group">
                <span class="icon">🪪</span>
                <input type="text" name="voterId" placeholder="Your Voter ID" required autofocus>
            </div>
            <div class="input-group">
                <span class="icon">📧</span>
                <input type="email" name="email" placeholder="Your registered email" required>
            </div>
            <button type="submit" class="btn-primary">Send Reset Code →</button>
        </form>
    </div>

    <!-- Step 2: Enter OTP -->
    <div th:if="${step == 'otp'}">
        <p style="color:#555;font-size:13px;margin-bottom:6px;text-align:center">
            We sent a 6-digit code to
        </p>
        <p style="color:#1a6b3c;font-weight:700;font-size:14px;text-align:center;margin-bottom:16px"
           th:text="${maskedEmail}"></p>

        <div th:if="${otpFallback}" style="background:#f0faf4;border:2px dashed #2d9e5f;border-radius:10px;padding:14px;margin-bottom:14px;text-align:center">
            <div style="font-size:12px;color:#555;margin-bottom:6px">⚠ Email failed. Your code is:</div>
            <div style="font-size:32px;font-weight:900;letter-spacing:10px;color:#1a6b3c" th:text="${otpFallback}"></div>
        </div>

        <form method="post" th:action="@{/forgot-password}" id="otpForm">
            <input type="hidden" name="step"    value="verify-otp">
            <input type="hidden" name="voterId" th:value="${voterId}">
            <input type="hidden" name="otp"     id="otpHidden">
            <div class="otp-inputs">
                <input class="otp-input" type="text" maxlength="1" id="o1" oninput="mn(this,'o2')" onkeydown="mp(event,this,'')">
                <input class="otp-input" type="text" maxlength="1" id="o2" oninput="mn(this,'o3')" onkeydown="mp(event,this,'o1')">
                <input class="otp-input" type="text" maxlength="1" id="o3" oninput="mn(this,'o4')" onkeydown="mp(event,this,'o2')">
                <input class="otp-input" type="text" maxlength="1" id="o4" oninput="mn(this,'o5')" onkeydown="mp(event,this,'o3')">
                <input class="otp-input" type="text" maxlength="1" id="o5" oninput="mn(this,'o6')" onkeydown="mp(event,this,'o4')">
                <input class="otp-input" type="text" maxlength="1" id="o6" oninput="mn(this,'')"   onkeydown="mp(event,this,'o5')">
            </div>
            <button type="button" class="btn-primary" onclick="submitOtp()">Verify Code</button>
        </form>
        <p style="text-align:center;font-size:12px;color:#aaa;margin-top:12px">
            Code expires in <span id="cd">10:00</span>
        </p>
    </div>

    <!-- Step 3: New password -->
    <div th:if="${step == 'reset'}">
        <p style="color:#555;font-size:13px;margin-bottom:20px;text-align:center">
            Set a new password for <strong th:text="${voterId}"></strong>.
        </p>
        <form method="post" th:action="@{/forgot-password}">
            <input type="hidden" name="step"    value="reset">
            <input type="hidden" name="voterId" th:value="${voterId}">
            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" name="newPassword" placeholder="New password (min. 6 chars)" required autofocus>
            </div>
            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" name="confirm" placeholder="Confirm new password" required>
            </div>
            <button type="submit" class="btn-primary">Reset Password ✓</button>
        </form>
    </div>

    <div class="auth-footer" style="margin-top:16px">
        Remembered it? <a th:href="@{/login}">Back to Sign In</a>
    </div>
</div>

<script>
function mn(el, nid) {
    el.value = el.value.replace(/[^0-9]/g,'');
    if (el.value && nid) document.getElementById(nid).focus();
    const vals = ['o1','o2','o3','o4','o5','o6'].map(id => document.getElementById(id)?.value || '');
    if (vals.every(v => v)) submitOtp();
}
function mp(e, el, pid) {
    if (e.key === 'Backspace' && !el.value && pid) document.getElementById(pid).focus();
}
function submitOtp() {
    const otp = ['o1','o2','o3','o4','o5','o6'].map(id => document.getElementById(id).value).join('');
    if (otp.length < 6) return;
    document.getElementById('otpHidden').value = otp;
    document.getElementById('otpForm').submit();
}
let s = 600;
const t = setInterval(() => {
    s--;
    const el = document.getElementById('cd');
    if (!el) { clearInterval(t); return; }
    el.textContent = Math.floor(s/60).toString().padStart(2,'0') + ':' + (s%60).toString().padStart(2,'0');
    if (s <= 0) { clearInterval(t); el.textContent = 'Expired'; }
}, 1000);
</script>
</body>
</html>
