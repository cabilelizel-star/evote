<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Vote System — Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-card">

    <div class="auth-avatar">&#128273;</div>

    <div class="auth-title-row">
        <hr><span>Reset Password</span><hr>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Step 1: Enter Voter ID -->
    <div th:if="${step == null}">
        <p class="auth-hint">Enter your Voter ID to find your account.</p>
        <form method="post" th:action="@{/forgot-password}">
            <input type="hidden" name="step" value="lookup">
            <div class="input-group">
                <span class="icon">&#128100;</span>
                <input type="text" name="voterId" placeholder="Voter ID" required autofocus>
            </div>
            <button type="submit" class="btn-primary">Find My Account</button>
        </form>
    </div>

    <!-- Step 2: Answer security question -->
    <div th:if="${step == 'answer'}">
        <p class="auth-hint">Security question:</p>
        <p class="auth-question" th:text="${question}"></p>
        <form method="post" th:action="@{/forgot-password}">
            <input type="hidden" name="step"    value="verify">
            <input type="hidden" name="voterId" th:value="${voterId}">
            <div class="input-group">
                <span class="icon">&#128273;</span>
                <input type="text" name="answer" placeholder="Your answer" required autofocus>
            </div>
            <button type="submit" class="btn-primary">Verify Answer</button>
        </form>
    </div>

    <!-- Step 3: Set new password -->
    <div th:if="${step == 'reset'}">
        <p class="auth-hint">Set a new password for <strong th:text="${voterId}"></strong>.</p>
        <form method="post" th:action="@{/forgot-password}">
            <input type="hidden" name="step"    value="reset">
            <input type="hidden" name="voterId" th:value="${voterId}">
            <div class="input-group">
                <span class="icon">&#128274;</span>
                <input type="password" name="newPassword" placeholder="New password" required autofocus>
            </div>
            <div class="input-group">
                <span class="icon">&#128274;</span>
                <input type="password" name="confirm" placeholder="Confirm new password" required>
            </div>
            <button type="submit" class="btn-primary">Reset Password</button>
        </form>
    </div>

    <div class="auth-footer" style="margin-top:16px">
        Remembered it? <a th:href="@{/login}">Back to Sign In</a>
    </div>
</div>
</body>
</html>
